# Local Postgres only. The password is for this development database, not production.
name: wandervibe

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: wandervibe
      POSTGRES_PASSWORD: wandervibe
      POSTGRES_DB: wandervibe
    ports:
      - "5432:5432"
    volumes:
      - wandervibe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wandervibe -d wandervibe"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  wandervibe-postgres:
