name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://wandervibe:wandervibe@localhost:5432/wandervibe
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wandervibe
          POSTGRES_PASSWORD: wandervibe
          POSTGRES_DB: wandervibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wandervibe -d wandervibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag wandervibe:ci .

      - name: Check container health
        run: |
          docker run --detach --name wandervibe --publish 3000:3000 wandervibe:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              docker rm --force wandervibe >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs wandervibe
          docker rm --force wandervibe >/dev/null
          exit 1
