name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://wandervibe:wandervibe@localhost:5432/wandervibe
    services:
      postgres:
        image: postgres:17.11@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_USER: wandervibe
          POSTGRES_PASSWORD: wandervibe
          POSTGRES_DB: wandervibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wandervibe -d wandervibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: wandervibe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          push: false
          load: true
          tags: wandervibe-migrate:ci
          cache-from: type=gha

      - name: Check migration CLI
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql://build:build@127.0.0.1:5432/build \
            --entrypoint npx \
            wandervibe-migrate:ci \
            --no-install prisma --version

      - name: Check container health
        run: |
          docker run --detach --name wandervibe --publish 3000:3000 wandervibe:ci
          healthy=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "${healthy}" -ne 1 ]; then
            docker logs wandervibe
            docker rm --force wandervibe >/dev/null
            exit 1
          fi
          # No database in this job. /api/ready must fail closed without leaking details.
          ready_status="$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:3000/api/ready)"
          docker logs wandervibe
          docker rm --force wandervibe >/dev/null
          if [ "${ready_status}" != "503" ]; then
            echo "Expected /api/ready to return 503 without a database, got ${ready_status}"
            cat /tmp/ready.json
            exit 1
          fi
          python3 -c 'import json; body=json.load(open("/tmp/ready.json")); assert body == {"status": "unavailable"}, body'

  bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Bicep CLI
        run: |
          version="v0.48.1"
          sha256="b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e"
          curl -fsSL -o "${RUNNER_TEMP}/bicep" "https://github.com/Azure/bicep/releases/download/${version}/bicep-linux-x64"
          echo "${sha256}  ${RUNNER_TEMP}/bicep" | sha256sum --check
          mkdir -p "${HOME}/.local/bin"
          install -m 755 "${RUNNER_TEMP}/bicep" "${HOME}/.local/bin/bicep"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Build Bicep
        run: |
          bicep build infra/main.bicep --outfile "${RUNNER_TEMP}/main.json"
          bicep build infra/cd.bicep --outfile "${RUNNER_TEMP}/cd.json"

      - name: Lint Bicep
        run: |
          status=0
          while IFS= read -r file; do
            echo "Linting ${file}"
            bicep lint "${file}" || status=1
          done < <(find infra -name '*.bicep' | sort)
          exit "${status}"

      - name: Validate parameter files
        run: |
          if grep -nE 'postgresAdminPassword[[:space:]]*=' infra/*.bicepparam | grep -v 'readEnvironmentVariable'; then
            echo "Parameter files must read POSTGRES_ADMIN_PASSWORD from the environment."
            exit 1
          fi
          if grep -n 'AZURE_DEPLOYER_OBJECT_ID' infra/*.bicepparam infra/*.bicep; then
            echo "The template must not take a deployer object id."
            exit 1
          fi
          export POSTGRES_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          bicep build-params infra/main.staging.bicepparam --outfile "${RUNNER_TEMP}/staging.parameters.json"
          bicep build-params infra/main.prod.bicepparam --outfile "${RUNNER_TEMP}/prod.parameters.json"
          rm -f "${RUNNER_TEMP}/staging.parameters.json" "${RUNNER_TEMP}/prod.parameters.json"

      - name: Check ingress allowlist
        run: bash infra/tests/check-access-restrictions.sh

      - name: Check continuous deployment
        run: bash infra/tests/check-cd.sh
